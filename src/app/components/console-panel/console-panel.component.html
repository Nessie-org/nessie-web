<div class="terminal" (click)="focusInput()">
  <!-- Output area -->
  <div class="terminal-output" #outputEl>
    @for (line of lines; track $index) {
      <div class="term-line" [ngClass]="getLineClass(line)">
        @if (line.type === 'input') {
          <span class="term-prompt">nessie:~$</span>
          <span class="term-text">{{ line.text.slice(2) }}</span>
        } @else {
          @if (line.timestamp) {
            <span class="term-time">{{ formatTime(line.timestamp) }}</span>
          }
          <span class="term-text">{{ line.text }}</span>
        }
      </div>
    }
  </div>

  <!-- Input row -->
  <div class="terminal-input-row">
    <span class="prompt-label">nessie:~$</span>
    <input #inputEl
      class="term-input"
      type="text"
      [(ngModel)]="inputValue"
      (keydown)="onKeyDown($event)"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      placeholder="type 'help' for commands…" />
  </div>
</div>
