<div class="tree-body">
  @if (!treeRoot) {
    <div class="empty-tree">
      <span class="empty-icon">🌲</span>
      <span>No graph loaded</span>
    </div>
  } @else {
    <ng-container *ngTemplateOutlet="nodeTpl; context: { node: treeRoot }"></ng-container>
  }
</div>

<ng-template #nodeTpl let-node="node">
  <div class="node-wrap">
    <div class="tree-node"
         [class.selected]="node.graphNode.id === selectedNodeId"
         [class.recursive]="node.isRecursive"
         [style.padding-left.px]="10 + node.depth * 14"
         (click)="selectNode(node)"
         [title]="formatProps(node.graphNode)">

      <span class="node-arrow"
            [class.clickable]="node.children.length > 0 && !node.isRecursive"
            (click)="node.children.length > 0 && !node.isRecursive && $event.stopPropagation(); toggleNode(node)">
        {{ getNodeIcon(node) }}
      </span>
      <span class="node-label">{{ node.graphNode.label }}</span>
      <span class="node-id">{{ node.graphNode.id }}</span>
      @if (node.isRecursive) {
        <span class="cycle-badge">↺ cycle</span>
      }
    </div>

    @if (node.expanded && !node.isRecursive) {
      @for (child of node.children; track child.graphNode.id) {
        <ng-container *ngTemplateOutlet="nodeTpl; context: { node: child }"></ng-container>
      }
    }
  </div>
</ng-template>
