[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nessie-explorer"
version = "0.1.0"
description = "Framework-agnostic HTML renderer for the Nessie Graph Explorer UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/nessie_explorer"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
